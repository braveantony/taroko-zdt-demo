routingMode: native
endpointRoutes:
  enabled: true
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16   # 必須與 Pod pool 相同

ipam:
  mode: multi-pool
  operator:
    autoCreateCiliumPodIPPools:
      default:
        ipv4:
          cidrs: ["10.244.0.0/16"]
          maskSize: 27

devices: eth0   # multi-pool + bpf.masquerade 必填

kubeProxyReplacement: true
k8sServiceHost: kind-control-plane
k8sServicePort: 6443

bpf:
  masquerade: true

l2announcements:
  enabled: true
externalIPs:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20

gatewayAPI:
  enabled: true

rollOutCiliumPods: true
operator:
  rollOutPods: true
