# Valkey — step4 的共享狀態庫:單副本、無持久化(emptyDir)、無密碼
# (只在 zdt-tour namespace 內部使用,存的是匿名導覽進度)。
# 註:Valkey 自己也是 stateful workload,如何零停機不在本 demo 範圍內。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999            # valkey 官方 image 的 valkey 使用者
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
